<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TDMRC Disaster Center</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #map { height: 100vh; width: 100%; }
        #info { position: absolute; top: 10px; right: 10px; z-index: 1000; background: white; padding: 10px; border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <div id="info">
        <h3>TDMRC Dashboard</h3>
        <p>Status: <span id="status">Checking...</span></p>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([-6.200000, 106.816666], 13); // Jakarta

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Check backend health
        fetch('/api/health')
            .then(res => res.json())
            .then(data => {
                const statusSpan = document.getElementById('status');
                if (data.status === 'ok') {
                    statusSpan.style.color = 'green';
                    statusSpan.innerText = 'Connected to Backend & DB';
                } else {
                    statusSpan.style.color = 'red';
                    statusSpan.innerText = 'Error: ' + data.error;
                }
            })
            .catch(err => {
                document.getElementById('status').innerText = 'Backend Unreachable';
                document.getElementById('status').style.color = 'red';
            });
    </script>
</body>
</html>
